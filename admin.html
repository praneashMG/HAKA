<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    // Enforce Admin Passcode Protection
    if (sessionStorage.getItem("haka_admin_authenticated") !== "true") {
      window.location.replace("index.html");
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS & Recruitment Admin Portal | HAKA SOLUTIONS</title>
  <link rel="icon" type="image/png" href="assets/logo/logobg-trimmed.png">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              green: '#183D32',
              'green-dark': '#102B23',
              'green-light': '#215244',
              gold: '#C19A5B',
              'gold-hover': '#ad8649',
              'gold-light': '#F6EEDB',
              ivory: '#FAF8F2',
              'warm-grey': '#E7E4DA'
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'Georgia', 'serif'],
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #F8F9FA;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #F1F1F1;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #D1D5DB;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #9CA3AF;
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col bg-[#F9FAFB]">

  <!-- Top Admin Bar -->
  <header class="bg-[#183D32] text-white border-b border-[#215244] sticky top-0 z-50 shadow-md">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-1.5 sm:gap-4">
      
      <!-- Brand & Portal Name -->
      <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
        <!-- Mobile Drawer Toggle Button -->
        <button id="btnMobileNavToggle" class="lg:hidden p-1.5 sm:p-2 rounded-xl bg-white/10 hover:bg-white/15 text-white transition-colors flex-shrink-0" aria-label="Toggle Navigation Menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>

        <a href="index.html" class="flex items-center gap-2 group flex-shrink-0" title="Return to Public Website">
          <img src="assets/logo/logobg-trimmed.png" alt="HAKA Logo" class="h-7 sm:h-9 w-auto brightness-200 contrast-125 object-contain flex-shrink-0">
          <div class="border-l border-white/20 pl-2 hidden min-[360px]:block">
            <span class="text-[9px] sm:text-xs uppercase tracking-widest text-[#C19A5B] font-bold block leading-none">CMS</span>
            <span class="text-xs sm:text-sm font-semibold tracking-tight text-white group-hover:text-[#C19A5B] transition-colors leading-none mt-0.5">Admin</span>
          </div>
        </a>
      </div>

      <!-- Quick Actions, User Badge & Public Site Link -->
      <div class="flex items-center gap-1.5 sm:gap-3 flex-shrink-0">
        <a href="index.html" class="hidden md:inline-flex items-center gap-1.5 text-xs font-semibold text-emerald-100 hover:text-white bg-white/10 hover:bg-white/15 px-2.5 py-1.5 rounded-lg transition-all border border-white/10">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
          <span>Live Site</span>
        </a>

        <!-- Current Role Selector Switcher -->
        <div class="flex items-center gap-1 bg-[#102B23] px-2 py-1.5 rounded-xl border border-white/10 text-xs">
          <span class="text-slate-400 hidden xl:inline">Role:</span>
          <select id="userRoleSwitcher" class="bg-transparent text-[#C19A5B] font-semibold focus:outline-none cursor-pointer max-w-[105px] sm:max-w-none text-[11px] sm:text-xs truncate">
            <option value="Super Admin" class="bg-[#183D32] text-white">Super Admin</option>
            <option value="Recruitment Manager" class="bg-[#183D32] text-white">Recruitment Manager</option>
            <option value="Content Editor" class="bg-[#183D32] text-white">Content Editor</option>
          </select>
        </div>

        <!-- User Profile Pill -->
        <div class="flex items-center gap-2 pl-1 border-l border-white/15">
          <div id="currentUserAvatar" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-[#C19A5B] text-brand-green font-bold text-xs flex items-center justify-center shadow-sm flex-shrink-0">
            ZK
          </div>
          <div class="hidden xl:block text-left">
            <div id="currentUserName" class="text-xs font-semibold text-white leading-tight">Zahir Khan</div>
            <div id="currentUserEmail" class="text-[10px] text-slate-300">admin@hakasolutions.com</div>
          </div>
        </div>

        <!-- Lock / Sign Out Button -->
        <button id="btnLockAdmin" title="Lock & Sign Out" class="p-1.5 text-slate-300 hover:text-white hover:bg-white/10 rounded-lg transition-colors flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Portal Layout: Sidebar + Dynamic Workspace -->
  <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col md:flex-row gap-6">

    <!-- Mobile Drawer Overlay Backdrop -->
    <div id="mobileDrawerBackdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden lg:hidden transition-opacity"></div>

    <!-- Navigation Sidebar: Off-canvas Drawer on mobile (<1024px) & Sticky Left Rail on desktop (>=1024px) -->
    <aside id="adminSidebarAside" class="fixed inset-y-0 left-0 w-72 bg-white z-50 transform -translate-x-full lg:translate-x-0 lg:static lg:w-64 lg:z-auto transition-transform duration-300 ease-in-out flex flex-col flex-shrink-0 shadow-2xl lg:shadow-none border-r lg:border-r-0 border-slate-200">
      
      <!-- Mobile Drawer Close Header -->
      <div class="flex items-center justify-between p-4 border-b border-slate-100 lg:hidden bg-slate-50">
        <div class="flex items-center gap-2">
          <img src="assets/logo/logobg-trimmed.png" alt="HAKA" class="h-6 w-auto">
          <span class="text-xs font-bold text-slate-900 uppercase tracking-wider">CMS Navigation</span>
        </div>
        <button id="btnMobileDrawerClose" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-200/60">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="bg-white lg:rounded-2xl lg:border lg:border-slate-200/80 lg:shadow-sm p-4 lg:sticky lg:top-24 flex-1 overflow-y-auto custom-scrollbar">
        <div class="px-3 py-2 text-[11px] font-bold uppercase tracking-wider text-slate-400">
          Core Modules
        </div>
        <nav class="space-y-1" id="adminSidebarNav">
          <!-- Dynamic nav items rendered by script based on roles -->
        </nav>

        <div class="mt-6 pt-6 border-t border-slate-100">
          <div class="px-3 py-2 text-[11px] font-bold uppercase tracking-wider text-slate-400">
            System State
          </div>
          <div class="px-3 py-2 bg-emerald-50 rounded-xl border border-emerald-100 text-xs text-emerald-800 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            <span>Local DB Synchronized</span>
          </div>
          <button id="btnResetData" class="mt-3 w-full text-left px-3 py-2 text-xs text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors flex items-center gap-2">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span>Reset Demo Records</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- Center/Right Dynamic View Workspace -->
    <main class="flex-1 min-w-0" id="adminMainContainer">
      <!-- Injected via JavaScript based on active module tab -->
    </main>

  </div>

  <!-- Reusable Modal Container for Adding/Editing Content & Viewing Resume Details -->
  <div id="adminModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div id="adminModalCard" class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-2xl w-full max-h-[90vh] flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-200">
      <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <h3 id="modalTitle" class="text-base font-bold text-slate-900">Modal Title</h3>
        <button id="modalCloseBtn" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg hover:bg-slate-200/60 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto custom-scrollbar flex-1">
        <!-- Form or detail fields injected here -->
      </div>
      <div id="modalFooter" class="px-6 py-3.5 bg-slate-50 border-t border-slate-100 flex items-center justify-end gap-3">
        <!-- Action buttons -->
      </div>
    </div>
  </div>

  <!-- Toast Notification Box -->
  <div id="adminToast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm">
    <span id="toastIcon" class="text-emerald-400">✓</span>
    <span id="toastMessage">Action completed successfully.</span>
  </div>

  <!-- Scripts -->
  <script src="js/cms-store.js"></script>
  <script src="js/admin-app.js"></script>
</body>
</html>
